# Everything that runs on the VPS: Traefik in front (HTTPS with Let's Encrypt, HTTP → HTTPS), the
# replay vault (github.com/Garanas/scfa-cs-replay), GoatCounter and error pages. Other sites, such as
# jipwijnia.nl, join as extra services with their own traefik.* labels. See README.md.
#
#   cp .env.example .env    # once, then fill it in
#   docker compose pull && docker compose up -d

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Through the socket proxy: the Docker socket itself would give Traefik root on the host.
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Every router on websecure gets a certificate from Let's Encrypt, so services only need
      # a Host rule. The HTTP-01 challenge is answered on port 80 before the redirect.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      # On every site, defined in traefik-dynamic.yaml: security headers, compression, and an error
      # page while a site is down. Also there: the 404 page for host names nobody serves.
      - --entrypoints.websecure.http.middlewares=security-headers@file,compress@file,error-pages@file
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    configs:
      - source: traefik-dynamic
        target: /etc/traefik/dynamic.yaml
    networks: [socket, vault, stats, errors]
    depends_on: [socket-proxy]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  # Lets Traefik read which containers exist (GET /containers, /events) and nothing else.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    mem_limit: 64m

  vault:
    image: ${VAULT_IMAGE:-ghcr.io/garanas/scfa-cs-replay:latest}
    restart: unless-stopped
    environment:
      # Trust X-Forwarded-For from Traefik: the container publishes no ports and shares its
      # network only with Traefik. The token proxy rate-limits per client address.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    # The image comes from CI, so what it may do is fixed here rather than in the image: the
    # non-root "app" user of the chiseled .NET image, no capabilities, nothing writable but /tmp.
    user: "1654:1654"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks: [vault]
    labels:
      traefik.enable: "true"
      traefik.http.routers.vault.rule: Host(`${VAULT_HOST:-vault.jipwijnia.nl}`)
      traefik.http.routers.vault.entrypoints: websecure
      traefik.http.services.vault.loadbalancer.server.port: "8080"

  # Visitor statistics (goatcounter.com): no cookies, no personal data, SQLite in a volume.
  # The vault counts itself (Analytics:GoatCounter in its appsettings.Production.json).
  # Create the first site from the command line before the first start, so nobody else can reach
  # the setup wizard; see README.md.
  goatcounter:
    image: arp242/goatcounter:2.7
    restart: unless-stopped
    volumes:
      - goatcounter:/home/goatcounter/goatcounter-data
    mem_limit: 128m
    networks: [stats]
    labels:
      traefik.enable: "true"
      traefik.http.routers.stats.rule: Host(`${STATS_HOST:-stats.jipwijnia.nl}`)
      traefik.http.routers.stats.entrypoints: websecure
      traefik.http.services.stats.loadbalancer.server.port: "8080"

  # The page visitors see while a site restarts (502-504) and for unknown host names (404); Traefik
  # uses it through traefik-dynamic.yaml. Self-contained HTML, no external resources.
  error-pages:
    image: tarampampam/error-pages:4.2
    restart: unless-stopped
    environment:
      TEMPLATE_NAME: app-down
      SEND_SAME_HTTP_CODE: "true"
    read_only: true
    cap_drop: [ALL]
    mem_limit: 32m
    networks: [errors]

# A file, not inline content: Compose copies inline content into the container, which a read-only
# container refuses; a file is mounted.
configs:
  traefik-dynamic:
    file: ./traefik-dynamic.yaml

# Each site shares a network with Traefik only. IPv6 on the networks Traefik is published from, so
# IPv6 visitors reach it with their own address (otherwise docker-proxy relays them over IPv4, and
# they all show up as the bridge gateway).
networks:
  socket:
    internal: true
  errors:
    internal: true
  vault:
    enable_ipv6: true
  stats:
    enable_ipv6: true

volumes:
  letsencrypt:
  goatcounter:
