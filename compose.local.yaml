# The stack on your own machine, without Let's Encrypt:
#
#   docker compose -f compose.yaml -f compose.local.yaml up -d
#
# Then open http://vault.localhost and http://stats.localhost (or https:// with Traefik's
# self-signed certificate). Signing in to the vault does not work here: its production redirect
# URI points at vault.jipwijnia.nl. Try an unreleased vault with VAULT_IMAGE=scfa-cs-replay:local.

services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Browsers ignore HSTS behind a self-signed certificate, so the headers are harmless here.
      - --entrypoints.websecure.http.middlewares=security-headers@file,compress@file,error-pages@file
      - --providers.file.filename=/etc/traefik/dynamic.yaml

  vault:
    labels:
      traefik.http.routers.vault.rule: Host(`vault.localhost`)
      # Plain HTTP as well, so no certificate warning is needed to try it.
      traefik.http.routers.vault-http.rule: Host(`vault.localhost`)
      traefik.http.routers.vault-http.entrypoints: web
      traefik.http.routers.vault-http.service: vault

  goatcounter:
    labels:
      traefik.http.routers.stats.rule: Host(`stats.localhost`)
      traefik.http.routers.stats-http.rule: Host(`stats.localhost`)
      traefik.http.routers.stats-http.entrypoints: web
      traefik.http.routers.stats-http.service: stats

# Not needed locally, and older Docker versions cannot pick an IPv6 subnet by themselves.
networks:
  vault:
    enable_ipv6: false
  stats:
    enable_ipv6: false
